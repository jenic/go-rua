name: test
on:
  push:
    branches: ['**']
    tags: ['**', '!v*']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOCACHE: ${{ github.workspace }}/.gocache
  GOMODCACHE: ${{ github.workspace }}/.gomodcache
  GOPATH: ${{ github.workspace }}/.gopath
  CGO_ENABLED: '1'

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify installed Go toolchain against go.mod
        run: python3 scripts/go_toolchain.py check-installed
      - name: Prepare build tools and dependencies
        run: bash .github/scripts/prepare-linux.sh
      - run: make check test-release
      - run: make verify-repro VERSION=v0.0.0-ci
      - name: Check the exact release binary
        env:
          RELEASE_TAG: v0.0.0-ci
        run: |
          bash .github/scripts/release.sh check-assets dist
          candidate=$(mktemp -d "$GITHUB_WORKSPACE/.gocache/candidate.XXXXXXXX")
          tar -xzf dist/go-rua_linux_amd64.tar.gz -C "$candidate"
          make test-release-binary RELEASE_BINARY="$candidate/go-rua" VERSION="$RELEASE_TAG"
          bash .github/scripts/test-arch.sh "$candidate/go-rua" "$RELEASE_TAG"
      - name: Require clean tracked files
        run: git diff --exit-code

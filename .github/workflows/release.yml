name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOCACHE: ${{ github.workspace }}/.gocache
  GOMODCACHE: ${{ github.workspace }}/.gomodcache
  GOPATH: ${{ github.workspace }}/.gopath
  CGO_ENABLED: '1'

jobs:
  validate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release.sh metadata >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify installed Go toolchain against go.mod
        run: python3 scripts/go_toolchain.py check-installed
      - name: Prepare build tools and dependencies
        run: bash .github/scripts/prepare-linux.sh
      - run: make verify-repro VERSION="$RELEASE_TAG"
      - name: Check the exact release binary
        run: |
          bash .github/scripts/release.sh check-assets dist
          candidate=$(mktemp -d "$GITHUB_WORKSPACE/.gocache/candidate.XXXXXXXX")
          tar -xzf dist/go-rua_linux_amd64.tar.gz -C "$candidate"
          make test-release-binary RELEASE_BINARY="$candidate/go-rua" VERSION="$RELEASE_TAG"
          bash .github/scripts/test-arch.sh "$candidate/go-rua" "$RELEASE_TAG"
          git diff --exit-code
      - name: Attest release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-path: |
            dist/go-rua_linux_amd64.tar.gz
            dist/SHA256SUMS
      - name: Include provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/provenance.sigstore.json
          bash .github/scripts/release.sh check-assets dist attested
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifacts
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Sign and verify every release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh sign dist
      - name: Upload, verify, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release.sh publish dist
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
